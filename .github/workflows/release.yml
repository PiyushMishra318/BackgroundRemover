name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV
        shell: pwsh
        run: |
          choco install opencv -y --no-progress
          $opencvDir = Get-ChildItem -Path C:/tools -Filter OpenCV* -Directory | Select-Object -First 1
          if (-not $opencvDir) { throw 'OpenCV install directory not found under C:/tools' }
          "OpenCV_DIR=$($opencvDir.FullName)/build" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -S . -DOpenCV_DIR="$env:OpenCV_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage release binary
        run: |
          mkdir release
          copy build/Release/bg-cutout.exe release/bg-cutout-windows-x64.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/bg-cutout-windows-x64.exe
